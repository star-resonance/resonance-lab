name: CI

# Branch pushes are covered by their pull_request run; push only runs on main.
# Pull requests always run: auto-merge.yml merges on a green run, so a
# docs-only PR must produce one too. Pushes to main skip non-source changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.memory/**'
      - 'LICENSE*'
  pull_request:
  # auto-merge.yml dispatches this on main after each merge (merges made with
  # GITHUB_TOKEN start no push run).
  workflow_dispatch:

permissions: {}

jobs:
  data:
    name: lint + data gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # CPU-only gate tooling; the model part (torch, unsloth, CUDA) is not installed here. Its only
      # CI check is the mock pipeline run inside `just check` (tests/mock_gpu/) -- see CLAUDE.md.
      - run: pip install -r requirements-dev.txt
      - uses: extractions/setup-just@v2
      - run: just check

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: a secret removed in a later commit is still in the repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action needs a paid licence for an organization's repositories, so the tool
      # itself: a pinned version, checked by Go's checksum database, built by the runner's Go
      # (GOTOOLCHAIN fetches the Go its go.mod asks for).
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # --redact: Actions logs are public, so a finding is reported without its value.
      - name: Scan the history
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .'
