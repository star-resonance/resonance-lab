# Dependabot version updates (governance HY-03): one PR a week per ecosystem with the minor and
# patch updates grouped; a major update gets its own PR. Dependabot branches are `dependabot/*`,
# so auto-merge.yml never merges them: Kade does, once CI is green. Security updates are a repo
# setting (Settings > Code security), not this file.
version: 2
updates:
  # Dependabot reads every requirements-*.txt here and cannot pick files. The GPU stacks
  # (unsloth, llamafactory, kev) pin torch, transformers, trl, peft and the rest on purpose:
  # changing them changes the model (own PR and an eval run, CLAUDE.md). So only the tools of
  # requirements-dev.txt are allowed; a new dev tool is added here too. An allow list fails
  # safe: a new GPU pin is never bumped by accident.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-name: pytest
      - dependency-name: ruff
      - dependency-name: pyyaml
      - dependency-name: rich
      - dependency-name: sacrebleu
    groups:
      dev-minor-patch:
        update-types: [minor, patch]

  # Action tags stay major tags (`@v4`).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
